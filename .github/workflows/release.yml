# Builds EasyTuber Animation Studio for Windows and macOS.
# Push a tag like v0.1.0 to build both and publish them as a GitHub Release (see RELEASING.md).
# "Run workflow" on the Actions tab builds them without releasing (download from the run's artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v. Run: npm version <x.y.z>"
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/EasyTuberStudio-win32-x64 -DestinationPath "EasyTuberStudio-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: EasyTuberStudio-*-windows-x64.zip

  mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - name: Ad-hoc sign and zip
        # Packaging edits Info.plist, which breaks Electron's own signature; Apple silicon refuses
        # to run an app whose signature is broken, so sign it again (ad hoc, no Apple account).
        run: |
          for arch in arm64 x64; do
            app="dist/EasyTuberStudio-darwin-$arch/EasyTuberStudio.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "EasyTuberStudio-${GITHUB_REF_NAME}-macos-$arch.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: EasyTuberStudio-*-macos-*.zip

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # this version's section of CHANGELOG.md, then how to install
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = ($2 == v || $2 == "["v"]")} p' CHANGELOG.md | tail -n +2 > notes.md
          cat >> notes.md <<'EOF'

          ## Download

          | Your computer | File |
          |---|---|
          | Windows 10 / 11 | `EasyTuberStudio-…-windows-x64.zip` |
          | Mac with Apple silicon (M1 and later) | `EasyTuberStudio-…-macos-arm64.zip` |
          | Mac with an Intel processor | `EasyTuberStudio-…-macos-x64.zip` |

          **Windows:** unzip, open the `EasyTuberStudio-win32-x64` folder and run `EasyTuberStudio.exe`. Keep the folder together. If SmartScreen says "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed yet).

          **Mac:** unzip and drag `EasyTuberStudio.app` to Applications. The app isn't notarised by Apple yet, so the first time: try to open it, then go to **System Settings → Privacy & Security** and click **Open Anyway**.

          You need [EASY-TUBER](https://github.com/pjcjonas/EasyTuber) to use the actions you make. See the [README](https://github.com/pjcjonas/EasyTuberAnimationStudio#readme) for how.
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "EasyTuber Animation Studio $GITHUB_REF_NAME" --notes-file notes.md --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "EasyTuber Animation Studio $GITHUB_REF_NAME" --notes-file notes.md
          fi
